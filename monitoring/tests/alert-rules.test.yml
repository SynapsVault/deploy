rule_files:
  - ../alert-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="backend",instance="backend:8080"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: BackendDown
        exp_alerts:
          - exp_labels:
              severity: critical
              team: backend
              job: backend
              instance: backend:8080
            exp_annotations:
              summary: Backend instance backend:8080 is down
              description: Backend target backend:8080 (job backend) has been unreachable for more than 1 minute.
              runbook_url: https://github.com/example/soroban-backend/blob/main/docs/runbooks/backend-down.md

  - interval: 1m
    input_series:
      - series: 'up{job="backend",instance="backend:8080"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: BackendDown
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",status="500"}'
        values: '0+60x10'
      - series: 'http_requests_total{job="backend",status="200"}'
        values: '0+540x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: HighHttp5xxErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              team: backend
            exp_annotations:
              summary: High HTTP 5xx error rate (10%)
              description: More than 5% of backend HTTP requests have returned 5xx responses over the last 5 minutes.
              runbook_url: https://github.com/example/soroban-backend/blob/main/docs/runbooks/http-5xx.md

  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",status="500"}'
        values: '0+1x10'
      - series: 'http_requests_total{job="backend",status="200"}'
        values: '0+999x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: HighHttp5xxErrorRate
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'soroban_backup_last_success_timestamp_seconds'
        values: '-100000x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              team: backend
            exp_annotations:
              summary: "Backup is stale for "
              description: "The last successful backup for  was more than 26 hours ago, exceeding the expected backup interval."
              runbook_url: https://github.com/example/soroban-backend/blob/main/docs/runbooks/backup-stale.md

  - interval: 1m
    input_series:
      - series: 'soroban_backup_last_success_timestamp_seconds'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupStale
        exp_alerts: []
