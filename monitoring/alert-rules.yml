groups:
  - name: backend-availability
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Backend instance {{ $labels.instance }} is down"
          description: "Backend target {{ $labels.instance }} (job {{ $labels.job }}) has been unreachable for more than 1 minute."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/backend-down.md"

      - alert: BackendTargetMissing
        expr: absent(up{job="backend"})
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "No backend targets are being scraped"
          description: "Prometheus has not scraped any backend targets for more than 5 minutes. The service may be removed from service discovery."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/backend-down.md"

  - name: frontend-availability
    rules:
      - alert: FrontendDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
          team: frontend
        annotations:
          summary: "Frontend public URL {{ $labels.instance }} is unreachable"
          description: "The blackbox HTTP probe against {{ $labels.instance }} has been failing for more than 2 minutes."
          runbook_url: "https://docs.example.com/runbooks/frontend-down"

      - alert: FrontendSlowResponse
        expr: probe_http_duration_seconds{job="blackbox-http", phase="connect"} > 2
        for: 10m
        labels:
          severity: warning
          team: frontend
        annotations:
          summary: "Frontend public URL {{ $labels.instance }} is slow"
          description: "The blackbox HTTP probe connect phase against {{ $labels.instance }} has exceeded 2s for more than 10 minutes."
          runbook_url: "https://docs.example.com/runbooks/frontend-down"

  - name: certificate-expiry
    rules:
      - alert: TlsCertificateExpiringSoon
        expr: |
          (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          team: frontend
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
          description: "The TLS certificate served by {{ $labels.instance }} will expire in less than 14 days."
          runbook_url: "https://docs.example.com/runbooks/certificate-expiry"

      - alert: TlsCertificateExpiringCritical
        expr: |
          (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) < 3 * 24 * 3600
        for: 1h
        labels:
          severity: critical
          team: frontend
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
          description: "The TLS certificate served by {{ $labels.instance }} will expire in less than 3 days."
          runbook_url: "https://docs.example.com/runbooks/certificate-expiry"

  - name: pod-restarts
    rules:
      - alert: PodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
          description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted more than 3 times in the last 15 minutes."
          runbook_url: "https://docs.example.com/runbooks/pod-crash-looping"

      - alert: PodRestartingFrequently
        expr: |
          increase(kube_pod_container_status_restarts_total[1h]) > 5
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently"
          description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted more than 5 times in the last hour."
          runbook_url: "https://docs.example.com/runbooks/pod-crash-looping"

  - name: http-errors
    rules:
      - alert: HighHttp5xxErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="backend", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="backend"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High HTTP 5xx error rate ({{ $value | humanizePercentage }})"
          description: "More than 5% of backend HTTP requests have returned 5xx responses over the last 5 minutes."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/http-5xx.md"

      - alert: ElevatedHttp5xxErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="backend", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="backend"}[5m]))
          ) > 0.01
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Elevated HTTP 5xx error rate ({{ $value | humanizePercentage }})"
          description: "More than 1% of backend HTTP requests have returned 5xx responses over the last 10 minutes."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/http-5xx.md"

      - alert: HighHttp4xxErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="backend", status=~"4.."}[5m]))
            /
            sum(rate(http_requests_total{job="backend"}[5m]))
          ) > 0.25
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High HTTP 4xx error rate ({{ $value | humanizePercentage }})"
          description: "More than 25% of backend HTTP requests have returned 4xx responses over the last 15 minutes."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/http-4xx.md"

  - name: http-latency
    rules:
      - alert: HighHttpLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{job="backend"}[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High HTTP p95 latency ({{ $value | humanizeDuration }})"
          description: "The 95th percentile backend HTTP request latency has exceeded 1s for more than 10 minutes."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/http-latency.md"

      - alert: CriticalHttpLatencyP99
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(http_request_duration_seconds_bucket{job="backend"}[5m])) by (le)
          ) > 3
        for: 10m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Critical HTTP p99 latency ({{ $value | humanizeDuration }})"
          description: "The 99th percentile backend HTTP request latency has exceeded 3s for more than 10 minutes."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/http-latency.md"

  - name: database
    rules:
      - alert: DatabaseConnectionFailures
        expr: |
          sum(rate(db_connection_errors_total{job="backend"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Database connection failures detected"
          description: "The backend is experiencing database connection errors at a rate of {{ $value | humanize }}/s over the last 5 minutes."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/database-connection.md"

      - alert: DatabaseConnectionPoolExhausted
        expr: |
          (
            db_connection_pool_in_use{job="backend"}
            /
            db_connection_pool_max{job="backend"}
          ) > 0.9
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Database connection pool nearly exhausted ({{ $value | humanizePercentage }})"
          description: "More than 90% of the backend database connection pool has been in use for over 5 minutes."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/database-connection.md"

      - alert: DatabaseDown
        expr: |
          pg_up{job="database"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Postgres instance {{ $labels.instance }} is down"
          description: "Postgres target {{ $labels.instance }} reports pg_up == 0 for more than 1 minute, indicating the database itself is unreachable even though the exporter is running."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/database-down.md"

      - alert: DatabaseExporterDown
        expr: |
          up{job="database"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Database exporter {{ $labels.instance }} is down"
          description: "The postgres-exporter target {{ $labels.instance }} has been unreachable for more than 1 minute, so database health cannot be observed."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/database-down.md"

      - alert: PostgresDatabaseSizeHigh
        expr: |
          pg_database_size_bytes{job="postgres"} > 10 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Postgres database {{ $labels.datname }} is large ({{ $value | humanize1024 }}B)"
          description: "Postgres database {{ $labels.datname }} on {{ $labels.instance }} exceeds 10 GiB of disk usage."
          runbook_url: "https://docs.example.com/runbooks/postgres-disk"

      - alert: PostgresDatabaseSizeCritical
        expr: |
          pg_database_size_bytes{job="postgres"} > 50 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Postgres database {{ $labels.datname }} is critically large ({{ $value | humanize1024 }}B)"
          description: "Postgres database {{ $labels.datname }} on {{ $labels.instance }} exceeds 50 GiB of disk usage."
          runbook_url: "https://docs.example.com/runbooks/postgres-disk"

  - name: backups
    rules:
      - alert: BackupJobFailed
        expr: |
          soroban_backup_success == 0
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Backup job failed for {{ $labels.instance }}"
          description: "The most recent backup run for {{ $labels.instance }} did not succeed (soroban_backup_success == 0, written by scripts/backup.sh) for more than 5 minutes."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/backup-failed.md"

      - alert: BackupStale
        expr: |
          (time() - soroban_backup_last_success_timestamp_seconds) > 26 * 3600
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Backup is stale for {{ $labels.instance }}"
          description: "The last successful backup for {{ $labels.instance }} was more than 26 hours ago, exceeding the expected backup interval."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/backup-stale.md"

  - name: stellar-soroban-rpc
    rules:
      - alert: StellarRpcErrors
        expr: |
          sum(rate(stellar_rpc_errors_total{job="backend"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Stellar RPC errors detected"
          description: "The backend is experiencing Stellar RPC errors at a rate of {{ $value | humanize }}/s over the last 5 minutes."
          runbook_url: "https://github.com/example/soroban-backend/blob/main/docs/runbooks/stellar-rpc.md"

      - alert: StellarRpcHighErrorRate
        expr: |
          (
            sum(rate(stellar_rpc_errors_total{job="backend"}[5m]))
            /
            sum(rate(stellar_rpc_requests_total{job="backend"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High Stellar RPC error rate ({{ $value | humanizePercentage }})"
          description: "More than 5% of Stellar RPC requests have failed over the last 5 minutes."
          runbook_url: "https://docs.example.com/runbooks/stellar-rpc"

      - alert: SorobanRpcErrors
        expr: |
          sum(rate(soroban_rpc_errors_total{job="backend"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Soroban RPC errors detected"
          description: "The backend is experiencing Soroban RPC errors at a rate of {{ $value | humanize }}/s over the last 5 minutes."
          runbook_url: "https://docs.example.com/runbooks/soroban-rpc"

      - alert: SorobanRpcHighErrorRate
        expr: |
          (
            sum(rate(soroban_rpc_errors_total{job="backend"}[5m]))
            /
            sum(rate(soroban_rpc_requests_total{job="backend"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High Soroban RPC error rate ({{ $value | humanizePercentage }})"
          description: "More than 5% of Soroban RPC requests have failed over the last 5 minutes."
          runbook_url: "https://docs.example.com/runbooks/soroban-rpc"

  - name: metrics-instrumentation
    rules:
      - alert: DatabaseConnectionPoolMetricsMissing
        expr: |
          absent(db_connection_pool_in_use{job="backend"})
          or
          absent(db_connection_pool_max{job="backend"})
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Database connection pool metrics are not being exported"
          description: "The backend is not exporting db_connection_pool_in_use / db_connection_pool_max, so DatabaseConnectionPoolExhausted can never fire. Add the instrumentation in SynapsVault/backend."
          runbook_url: "https://docs.example.com/runbooks/missing-metrics"

      - alert: StellarRpcMetricsMissing
        expr: |
          absent(stellar_rpc_requests_total{job="backend"})
          or
          absent(stellar_rpc_errors_total{job="backend"})
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Stellar RPC metrics are not being exported"
          description: "The backend is not exporting stellar_rpc_requests_total / stellar_rpc_errors_total, so the Stellar RPC alerts can never fire. Add the instrumentation in SynapsVault/backend."
          runbook_url: "https://docs.example.com/runbooks/missing-metrics"

      - alert: SorobanRpcMetricsMissing
        expr: |
          absent(soroban_rpc_requests_total{job="backend"})
          or
          absent(soroban_rpc_errors_total{job="backend"})
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Soroban RPC metrics are not being exported"
          description: "The backend is not exporting soroban_rpc_requests_total / soroban_rpc_errors_total, so the Soroban RPC alerts can never fire. Add the instrumentation in SynapsVault/backend."
          runbook_url: "https://docs.example.com/runbooks/missing-metrics"
