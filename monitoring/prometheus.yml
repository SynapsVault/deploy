global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'synapsvault-monitor'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Mounted at this path by docker-compose.yml.
rule_files:
  - '/etc/prometheus/alert-rules.yml'

# Job names matter: monitoring/alert-rules.yml selects on job="backend" and
# job="database".
scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'

  - job_name: 'backend'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: 'synapsvault-backend'
          tier: 'application'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}'

  - job_name: 'database'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'synapsvault-database'
          tier: 'data'

  # Backup metrics (soroban_backup_*) are written by scripts/backup.sh to a
  # node_exporter textfile collector. Uncomment when backups run on a host with
  # node_exporter; the GitHub Actions backup job has no exporter to scrape.
  # - job_name: 'backup'
  #   scrape_interval: 60s
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'backup'
  #         tier: 'infrastructure'
