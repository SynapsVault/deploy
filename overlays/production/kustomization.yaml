apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: synapsvault-production
resources:
  - ../../k8s
  - resourcequota.yaml
patches:
  - target:
      kind: Namespace
      name: synapsvault
    patch: |-
      - op: replace
        path: /metadata/name
        value: synapsvault-production
  - target:
      kind: NetworkPolicy
      name: allow-ingress-controller
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ingress-nginx-production
