apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: synapsvault
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: secrets
type: Opaque
# ---------------------------------------------------------------------------
# WARNING: DO NOT COMMIT REAL SECRET VALUES TO THIS FILE.
#
# This manifest is a TEMPLATE ONLY. The values below are clearly-marked
# placeholders and MUST be replaced before deployment. It is deliberately not
# listed in kustomization.yaml, so `kubectl apply -k k8s/` never overwrites
# the real secret with these placeholders.
#
# Inject real values using one of the following approaches:
#
#   1. Sealed Secrets (Bitnami):
#        kubeseal --format yaml < secrets.yaml > sealed-secrets.yaml
#      Commit only the resulting SealedSecret, never this file with real data.
#
#   2. External Secrets Operator:
#        Reference a backend (Vault, AWS Secrets Manager, GCP Secret Manager,
#        etc.) via an ExternalSecret resource that syncs into this Secret.
#
#   3. kubectl create secret (imperative, for local/dev use only):
#        kubectl create secret generic backend-secret --namespace synapsvault \
#          --from-literal=DATABASE_URL='<value>' \
#          --from-literal=SUPABASE_SERVICE_KEY='<value>' \
#          --from-literal=AGENT_SECRET_KEY='<value>' \
#          --from-literal=REGISTRY_SECRET_KEY='<value>' \
#          --from-literal=STELLAR_SECRET_KEY='<value>' \
#          --from-literal=OPENROUTER_API_KEY='<value>' \
#          --from-literal=ADMIN_API_KEY='<value>' \
#          --dry-run=client -o yaml | kubectl apply -f -
#
#   4. CI/CD pipeline injection:
#        Populate these values from your pipeline's secret store at deploy time.
# ---------------------------------------------------------------------------
stringData:
  # Postgres / Supabase connection string, e.g.
  # postgresql://user:password@host:5432/dbname
  DATABASE_URL: "REPLACE_ME_DATABASE_URL"

  # Supabase service-role key (server-side only; bypasses RLS).
  SUPABASE_SERVICE_KEY: "REPLACE_ME_SUPABASE_SERVICE_KEY"

  # Shared secret used to authenticate agent <-> backend communication.
  AGENT_SECRET_KEY: "REPLACE_ME_AGENT_SECRET_KEY"

  # Key used to sign/verify registry payloads.
  REGISTRY_SECRET_KEY: "REPLACE_ME_REGISTRY_SECRET_KEY"

  # Stellar account secret key (S...). Handle with extreme care.
  STELLAR_SECRET_KEY: "REPLACE_ME_STELLAR_SECRET_KEY"

  # OpenRouter API key for LLM access.
  OPENROUTER_API_KEY: "REPLACE_ME_OPENROUTER_API_KEY"

  # Admin API key for privileged endpoints.
  ADMIN_API_KEY: "REPLACE_ME_ADMIN_API_KEY"