apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: synapsvault

# secrets.yaml is intentionally NOT listed: it is a template with placeholder
# values, and applying it on every deploy would overwrite the real secret.
# Create `backend-secret` out-of-band (see docs/DEPLOY-KUBERNETES.md).
resources:
  - namespace.yaml
  - configmap.yaml
  - backend-serviceaccount.yaml
  - backend-migrate-job.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-serviceaccount.yaml
  - frontend-deployment.yaml
  - pdb.yaml
  - ingress.yaml
  - networkpolicy.yaml
  # Monitoring stack (kube-prometheus-stack CRs). See docs/DEPLOY-KUBERNETES.md.
  - monitoring-servicemonitors.yaml
  - prometheus-rule.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: synapsvault
      app.kubernetes.io/managed-by: kustomize
    # Selectors are immutable on existing Deployments; don't touch them.
    includeSelectors: false

# Images are pinned to an explicit tag so a manual `kubectl apply -k k8s/`
# never deploys `latest` (which, combined with IfNotPresent, lets nodes run
# different versions). CI overrides these to the commit SHA with
# `kustomize edit set image`.
#
# Manual deploy: pin to the tag/digest you want before applying, e.g.
#   kustomize edit set image \
#     backend=ghcr.io/synapsvault/deploy/backend:<tag-or-digest> \
#     backend-migrate=ghcr.io/synapsvault/deploy/backend-migrate:<tag-or-digest> \
#     frontend=ghcr.io/synapsvault/deploy/frontend:<tag-or-digest>
#   kubectl apply -k k8s/
# Replace <tag-or-digest> with a released tag (e.g. a commit SHA) or a
# `@sha256:...` digest. Do not commit `latest` back into this file.
images:
  - name: backend
    newName: ghcr.io/synapsvault/deploy/backend
    newTag: 0.0.0
  - name: backend-migrate
    newName: ghcr.io/synapsvault/deploy/backend-migrate
    newTag: 0.0.0
  - name: frontend
    newName: ghcr.io/synapsvault/deploy/frontend
    newTag: 0.0.0

replacements:
  - source:
      kind: ConfigMap
      name: backend-config
      fieldPath: data.DEPLOY_HOST
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: ConfigMap
          name: backend-config
        fieldPaths:
          - data.ALLOWED_ORIGINS
        options:
          delimiter: /
          index: 2
