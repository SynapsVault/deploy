apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: synapsvault

# secrets.yaml is intentionally NOT listed: it is a template with placeholder
# values, and applying it on every deploy would overwrite the real secret.
# Create `backend-secret` out-of-band (see docs/DEPLOY-KUBERNETES.md).
resources:
  - namespace.yaml
  - configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: synapsvault
      app.kubernetes.io/managed-by: kustomize
    # Selectors are immutable on existing Deployments; don't touch them.
    includeSelectors: false

# CI pins these to the commit SHA with `kustomize edit set image`.
images:
  - name: backend
    newName: ghcr.io/synapsvault/deploy/backend
    newTag: latest
  - name: backend-migrate
    newName: ghcr.io/synapsvault/deploy/backend-migrate
    newTag: latest
  - name: frontend
    newName: ghcr.io/synapsvault/deploy/frontend
    newTag: latest
