apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: synapsvault

# secrets.yaml is intentionally NOT listed: it is a template with placeholder
# values, and applying it on every deploy would overwrite the real secret.
# Create `backend-secret` out-of-band (see docs/DEPLOY-KUBERNETES.md).
resources:
  - namespace.yaml
  - limitrange.yaml
  - configmap.yaml
  - backend-serviceaccount.yaml
  - backend-migrate-job.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-serviceaccount.yaml
  - frontend-deployment.yaml
  - pdb.yaml
  - ingress.yaml
  - networkpolicy.yaml
  # Monitoring stack (kube-prometheus-stack CRs). See docs/DEPLOY-KUBERNETES.md.
  - monitoring-servicemonitors.yaml
  - prometheus-rule.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: synapsvault
      app.kubernetes.io/managed-by: kustomize
    # Selectors are immutable on existing Deployments; don't touch them.
    includeSelectors: false

# Images are pinned to an explicit tag so a manual `kubectl apply -k k8s/`
# never deploys `latest` (which, combined with IfNotPresent, lets nodes run
# different versions). CI overrides these to the commit SHA with
# `kustomize edit set image`.
#
# Manual deploy: pin to the tag/digest you want before applying, e.g.
#   kustomize edit set image \
#     backend=ghcr.io/synapsvault/deploy/backend:<tag-or-digest> \
#     backend-migrate=ghcr.io/synapsvault/deploy/backend-migrate:<tag-or-digest> \
#     frontend=ghcr.io/synapsvault/deploy/frontend:<tag-or-digest>
#   kubectl apply -k k8s/
# Replace <tag-or-digest> with a released tag (e.g. a commit SHA) or a
# `@sha256:...` digest. Do not commit `latest` back into this file.
images:
  - name: backend
    newName: ghcr.io/synapsvault/deploy/backend
    newTag: 0.0.0
  - name: backend-migrate
    newName: ghcr.io/synapsvault/deploy/backend-migrate
    newTag: 0.0.0
  - name: frontend
    newName: ghcr.io/synapsvault/deploy/frontend
    newTag: 0.0.0

# Ingress-controller namespace used by the NetworkPolicies to allow traffic
# from the ingress controller. Override per environment with
#   kustomize edit set configmap ingress-controller-config \
#     --from-literal=namespace=<your-controller-namespace>
# or by patching the ConfigMap. The value is propagated to the
# `ingress-controller-namespace` label on the synapsvault namespace, which the
# NetworkPolicies select on. It must name a single namespace; an empty value
# would broaden access, so keep it set.
#
# `dns-resolver-ip` is the egress DNS target for the backend and frontend
# NetworkPolicies. It defaults to the standard kube-dns ClusterIP
# (kube-system/kube-dns). Clusters running NodeLocal DNS must override it with
# the node-local resolver address (typically 169.254.20.10) so the egress
# NetworkPolicies allow DNS egress. Discover the address with:
#   kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'
#   kubectl -n kube-system get ds node-local-dns \
#     -o jsonpath='{.spec.template.spec.containers[0].args}' | tr ' ' '\n' | grep localip
# Then override per environment:
#   kustomize edit set configmap dns-resolver-config \
#     --from-literal=resolver-ip=<resolver-address>
# See docs/DEPLOY-KUBERNETES.md for verification of both layouts.
configMapGenerator:
  - name: ingress-controller-config
    literals:
      - namespace=ingress-nginx
  - name: dns-resolver-config
    literals:
      - resolver-ip=10.96.0.10

replacements:
  - source:
      kind: ConfigMap
      name: backend-config
      fieldPath: data.DEPLOY_HOST
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: ConfigMap
          name: backend-config
        fieldPaths:
          - data.ALLOWED_ORIGINS
        options:
          delimiter: /
          index: 2
  # Propagate the configured ingress-controller namespace onto the
  # synapsvault Namespace as a label so NetworkPolicies can select it without
  # hardcoding `ingress-nginx`.
  - source:
      kind: ConfigMap
      name: ingress-controller-config
      fieldPath: data.namespace
    targets:
      - select:
          kind: Namespace
          name: synapsvault
        fieldPaths:
          - metadata.labels.ingress-controller-namespace
        options:
          create: true
  # Propagate the configured DNS resolver address onto the synapsvault
  # Namespace as a label so the backend and frontend egress NetworkPolicies
  # can select it without hardcoding the kube-dns ClusterIP. Override
  # `dns-resolver-config` for NodeLocal DNS clusters (see above).
  - source:
      kind: ConfigMap
      name: dns-resolver-config
      fieldPath: data.resolver-ip
    targets:
      - select:
          kind: Namespace
          name: synapsvault
        fieldPaths:
          - metadata.labels.dns-resolver-ip
        options:
          create: true
