# Two Ingress objects share one host:
#   /api/*  -> backend, with the /api prefix stripped (the backend serves its
#              routes from the root, e.g. /resources, /publishers, /health)
#   /*      -> frontend SPA (which has its own /resources, /admin, ... pages)
# The frontend is built with VITE_API_URL=/api to match.
#
# The host and TLS secret are parameterised via Kustomize vars driven by
# DEPLOY_HOST (see k8s/kustomization.yaml). Set DEPLOY_HOST at deploy time
# (e.g. `kustomize build --env DEPLOY_HOST=app.example.com` or an overlay
# patch) and the host, TLS hosts and TLS secret name are all derived from it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-api
  labels:
    app.kubernetes.io/name: synapsvault
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com
      secretName: synapsvault-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-web
  labels:
    app.kubernetes.io/name: synapsvault
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com
      secretName: synapsvault-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
