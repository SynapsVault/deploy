apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      # Optional private registry pull credentials (issue #172).
      # Set `imagePullSecrets` in the kustomization to the name of a
      # pre-provisioned docker-registry Secret; leave it unset for public
      # registries so deployments keep working unchanged.
      imagePullSecrets: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: frontend
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: frontend-config
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        # Scratch-space needs (issue #165): the read-only root filesystem
        # forces nginx to write to the emptyDir volumes below. nginx-cache
        # holds proxy/buffer temp files, nginx-run holds the pid file and
        # socket, and tmp holds transient request bodies. The emptyDir
        # sizeLimits (64Mi + 8Mi + 16Mi = 88Mi) plus a small headroom for
        # container logs are covered by the ephemeral-storage limit below.
        # Verify normal startup under these limits by rolling out the
        # Deployment and confirming pods reach Ready (startupProbe passes)
        # and that `kubectl describe pod` shows no ephemeral-storage
        # eviction or emptyDir sizeLimit errors.
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
            ephemeral-storage: 256Mi
      volumes:
      - name: nginx-cache
        emptyDir:
          sizeLimit: 64Mi
      - name: nginx-run
        emptyDir:
          sizeLimit: 8Mi
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app: frontend
data:
  APP_API_URL: /api
  APP_NETWORK: testnet
  APP_SENTRY_DSN: ''
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
