name: Deploy Contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy contracts to'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet
      contracts_ref:
        description: 'Git ref of SynapsVault/contracts to build'
        required: true
        default: 'main'
        type: string
      dry_run:
        description: 'Run pre-flight checks only (no transactions)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-contracts-${{ inputs.network }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Mainnet deployments require a manual approval on this environment.
    environment: ${{ inputs.network == 'mainnet' && 'mainnet-approval' || 'testnet' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout contracts
        uses: actions/checkout@v4
        with:
          repository: SynapsVault/contracts
          ref: ${{ inputs.contracts_ref }}
          path: contracts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Build contracts
        working-directory: contracts
        run: |
          cargo build --target wasm32-unknown-unknown --release --workspace
          ls -lh target/wasm32-unknown-unknown/release/*.wasm

      - name: Deploy contracts
        env:
          NETWORK: ${{ inputs.network }}
          STELLAR_SECRET_KEY: ${{ secrets.DEPLOYER_SECRET_KEY }}
          # Optional for testnet (defaults to the public RPC); required for mainnet.
          SOROBAN_RPC_URL: ${{ inputs.network == 'mainnet' && secrets.MAINNET_RPC_URL || secrets.TESTNET_RPC_URL }}
          # Optional: admin passed to init(); defaults to the deployer.
          ADMIN_PUBLIC_KEY: ${{ vars.ADMIN_PUBLIC_KEY }}
          CONTRACTS_WASM_DIR: ${{ github.workspace }}/contracts/target/wasm32-unknown-unknown/release
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--yes)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          npm run deploy:contracts -- "${args[@]}"

      - name: Upload contract IDs artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: contract-ids-${{ inputs.network }}-${{ github.run_id }}
          path: contract-ids.env
          if-no-files-found: error
          retention-days: 90
