name: Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy-k8s.yml'
  # Triggered by the backend/frontend repos when their code changes.
  # Sender workflow (in SynapsVault/backend and SynapsVault/frontend):
  #
  #   name: Trigger deploy
  #   on:
  #     push:
  #       branches: [main]
  #   jobs:
  #     dispatch:
  #       runs-on: ubuntu-latest
  #       steps:
  #         - uses: peter-evans/repository-dispatch@v3
  #           with:
  #             token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}  # PAT with repo scope on this repo
  #             repository: SynapsVault/deploy
  #             event-type: app-updated
  #             client-payload: |
  #               {"backend_ref": "${{ github.sha }}", "frontend_ref": "main"}
  #
  # The client_payload may include `backend_ref` and/or `frontend_ref` to
  # build specific refs; omitted values fall back to `main`.
  repository_dispatch:
    types:
      - app-updated
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target overlay (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  KUSTOMIZE_VERSION: '5.4.3'

jobs:
  validate:
    name: Validate Kustomize overlays
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      image-prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
      # The Dockerfiles live here; the application source lives in sibling repos.
      - name: Checkout backend source
        uses: actions/checkout@v7
        with:
          repository: SynapsVault/backend
          ref: ${{ inputs.backend_ref || github.event.client_payload.backend_ref || 'main' }}
          path: src/backend

      - name: Checkout frontend source
        uses: actions/checkout@v7
        with:
          repository: SynapsVault/frontend
          ref: ${{ inputs.frontend_ref || github.event.client_payload.frontend_ref || 'main' }}
          path: src/frontend

      - name: Compute image names
        id: meta
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kustomize

      - name: Build base
        run: kustomize build k8s/base > /dev/null

      - name: Build staging overlay
        run: kustomize build k8s/overlays/staging > /dev/null

      - name: Build production overlay
        run: kustomize build k8s/overlays/production > /dev/null

  deploy:
    name: Deploy (${{ github.event.inputs.environment || 'staging' }})
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v7
        with:
          context: ./src/backend
          file: ./backend/Dockerfile
          target: runtime
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push backend migrate image
        id: build-backend-migrate
        uses: docker/build-push-action@v7
        with:
          context: ./src/backend
          file: ./backend/Dockerfile
          target: migrate
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/backend-migrate:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/backend-migrate:latest
          cache-from: |
            type=gha,scope=backend-migrate
            type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend-migrate

      # The frontend image is environment-agnostic: VITE_* values are no longer
      # baked in at build time. Runtime configuration is injected via env vars
      # (see frontend/Dockerfile entrypoint, which renders /config.js from
      # window.__APP_CONFIG__) and supplied by the k8s manifests at deploy time.
      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./src/frontend
          file: ./frontend/Dockerfile
          push: true
          provenance: true
          sbom: true
          build-args: |
            VITE_API_URL=/api
            VITE_NETWORK=${{ vars.STELLAR_NETWORK || 'testnet' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign backend image (keyless)
        env:
          DIGEST: ${{ steps.build-backend.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.prefix }}/backend
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Sign backend migrate image (keyless)
        env:
          DIGEST: ${{ steps.build-backend-migrate.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.prefix }}/backend-migrate
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Sign frontend image (keyless)
        env:
          DIGEST: ${{ steps.build-frontend.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.prefix }}/frontend
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  scan:
    name: Scan Images for Vulnerabilities
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - backend
          - backend-migrate
          - frontend
    steps:
      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.image-prefix }}/${{ matrix.image }}:${{ needs.build-and-push.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.image }}.sarif'
          category: 'trivy-${{ matrix.image }}'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push, scan]
    environment:
      name: staging
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check cluster credentials
        id: config
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          if [[ -z "$KUBECONFIG_B64" ]]; then
            echo "::warning::Deploy skipped: the KUBECONFIG secret is not configured for the staging environment. Images were still built and pushed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate environment variables (k8s target)
        # Fail fast if any required variable is missing or contains a placeholder.
        # Secrets are mapped from GitHub Actions secrets into the environment so
        # the script can verify they have been filled in.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          STELLAR_NETWORK: ${{ vars.STELLAR_NETWORK }}
          SOROBAN_RPC_URL: ${{ vars.SOROBAN_RPC_URL }}
          USDC_CONTRACT_ID: ${{ vars.USDC_CONTRACT_ID }}
          PAY_TO: ${{ vars.PAY_TO }}
          AGENT_SECRET_KEY: ${{ secrets.AGENT_SECRET_KEY }}
          REGISTRY_SECRET_KEY: ${{ secrets.REGISTRY_SECRET_KEY }}
          STELLAR_CONTRACT_VAULT_REGISTRY: ${{ vars.STELLAR_CONTRACT_VAULT_REGISTRY }}
          STELLAR_CONTRACT_ACCESS_LEASE: ${{ vars.STELLAR_CONTRACT_ACCESS_LEASE }}
          STELLAR_CONTRACT_SUBSCRIPTION: ${{ vars.STELLAR_CONTRACT_SUBSCRIPTION }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
          STELLAR_PUBLIC_KEY: ${{ vars.STELLAR_PUBLIC_KEY }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'app' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/check-env.js --target k8s

      - name: Set up kubectl
        if: steps.config.outputs.ready == 'true'
        uses: azure/setup-kubectl@v5
        with:
          version: v1.31.0

      - name: Configure kubeconfig
        if: steps.config.outputs.ready == 'true'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Pin image tags
        if: steps.config.outputs.ready == 'true'
        working-directory: ./k8s/overlays/staging
        env:
          PREFIX: ${{ needs.build-and-push.outputs.image-prefix }}
          TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          kustomize edit set image \
            "backend=${PREFIX}/backend:${TAG}" \
            "backend-migrate=${PREFIX}/backend-migrate:${TAG}" \
            "frontend=${PREFIX}/frontend:${TAG}"
          kubectl kustomize . | grep -E '^\s+image:'

      - name: Apply manifests
        if: steps.config.outputs.ready == 'true'
        run: |
          kubectl apply -k k8s/overlays/staging
          kubectl -n synapsvault-staging rollout status deployment/backend --timeout=300s
          kubectl -n synapsvault-staging rollout status deployment/frontend --timeout=180s

      - name: Smoke test
        id: smoke
        if: steps.config.outputs.ready == 'true'
        env:
          BASE_URL: ${{ vars.DEPLOY_URL }}
        run: node scripts/06-smoke-test.js

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, scan, deploy-staging]
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kustomize
          if [[ -z "$KUBECONFIG_B64" ]]; then
            echo "::warning::Deploy skipped: the KUBECONFIG secret is not configured for the production environment. Images were still built and pushed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up kubectl
        if: steps.config.outputs.ready == 'true'
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v5
        with:
          version: v1.31.0

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy overlay
        run: |
          OVERLAY="${{ github.event.inputs.environment || 'staging' }}"
          kustomize build "k8s/overlays/${OVERLAY}" | kubectl apply -f -
      - name: Pin image tags
        if: steps.config.outputs.ready == 'true'
        working-directory: ./k8s/overlays/production
        env:
          PREFIX: ${{ needs.build-and-push.outputs.image-prefix }}
          TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          kustomize edit set image \
            "backend=${PREFIX}/backend:${TAG}" \
            "backend-migrate=${PREFIX}/backend-migrate:${TAG}" \
            "frontend=${PREFIX}/frontend:${TAG}"
          kubectl kustomize . | grep -E '^\s+image:'

      # Runtime configuration for the frontend image. These env vars are read
      # by the container entrypoint at start to render /config.js, so the same
      # image can be promoted across environments without a rebuild.
      - name: Configure frontend runtime env
        if: steps.config.outputs.ready == 'true'
        working-directory: ./k8s
        env:
          FRONTEND_API_URL: ${{ vars.FRONTEND_API_URL || '/api' }}
          FRONTEND_NETWORK: ${{ vars.STELLAR_NETWORK || 'testnet' }}
        run: |
          kubectl -n synapsvault create configmap frontend-runtime-config \
            --from-literal=API_URL="$FRONTEND_API_URL" \
            --from-literal=NETWORK="$FRONTEND_NETWORK" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        id: apply
        if: steps.config.outputs.ready == 'true'
        run: |
          kubectl apply -k k8s/overlays/production
          kubectl -n synapsvault delete job backend-migrate --ignore-not-found
          kubectl apply -k k8s/
          kubectl -n synapsvault rollout restart deployment/frontend
          # Track which deployments have been rolled out so a failure can be
          # rolled back precisely. Each successful rollout is recorded.
          : > "$RUNNER_TEMP/rolled_out"
          if kubectl -n synapsvault rollout status deployment/backend --timeout=300s; then
            echo "backend" >> "$RUNNER_TEMP/rolled_out"
          else
            echo "backend" >> "$RUNNER_TEMP/failed"
            exit 1
          fi
          if kubectl -n synapsvault rollout status deployment/frontend --timeout=180s; then
            echo "frontend" >> "$RUNNER_TEMP/rolled_out"
          else
            echo "frontend" >> "$RUNNER_TEMP/failed"
            exit 1
          fi

      - name: Roll back failed rollout
        if: failure() && steps.config.outputs.ready == 'true' && steps.apply.outcome == 'failure'
        run: |
          {
            echo "### Rollback"
            echo ""
            echo "A rollout failed; attempting \`kubectl rollout undo\` for the affected deployment(s)."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          failed_file="$RUNNER_TEMP/failed"
          if [[ ! -s "$failed_file" ]]; then
            # Fall back to rolling back both deployments if we cannot tell
            # which one failed (e.g. the apply step failed before recording).
            printf 'backend\nfrontend\n' > "$failed_file"
          fi

          rollback_failed=0
          while read -r deployment; do
            [[ -z "$deployment" ]] && continue
            echo "Rolling back deployment/$deployment..."
            if kubectl -n synapsvault rollout undo "deployment/$deployment"; then
              echo "- \`deployment/$deployment\`: rolled back" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`deployment/$deployment\`: rollback FAILED" >> "$GITHUB_STEP_SUMMARY"
              rollback_failed=1
            fi
          done < "$failed_file"

          if [[ "$rollback_failed" -ne 0 ]]; then
            echo "::error::One or more rollbacks failed; manual intervention required."
            exit 1
          fi
          kubectl -n synapsvault wait --for=condition=complete job/backend-migrate --timeout=180s
          kubectl -n synapsvault rollout status deployment/backend --timeout=300s
          kubectl -n synapsvault rollout status deployment/frontend --timeout=180s

      - name: Smoke test
        id: smoke
        if: steps.config.outputs.ready == 'true'
        env:
          BASE_URL: ${{ vars.DEPLOY_URL }}
        run: node scripts/06-smoke-test.js
