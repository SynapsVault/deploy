name: Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy-k8s.yml'
  repository_dispatch:
    types: [app-deploy]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (validated against the cluster credentials before any change)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      dns_layout:
        description: 'DNS resolver layout to verify'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - kube-dns
          - nodelocaldns
      promote_staging_run_id:
        description: 'Production only (#153): run ID of a successful staging deploy whose release manifest to promote. Deploys its exact image digests instead of resolving app refs.'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # #158: hard ceiling for the whole deployment job.
    timeout-minutes: 30
    # Environment-scoped secrets/variables: KUBE_CONFIG plus the expected cluster
    # identity (KUBE_EXPECTED_CONTEXT, KUBE_EXPECTED_SERVER) for that environment.
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
      # Read the staging run and its release-manifest artifact when promoting.
      actions: read
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
      PROMOTE_STAGING_RUN_ID: ${{ github.event.inputs.promote_staging_run_id || '' }}
      EXPECTED_KUBE_CONTEXT: ${{ vars.KUBE_EXPECTED_CONTEXT }}
      EXPECTED_KUBE_SERVER: ${{ vars.KUBE_EXPECTED_SERVER }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10

      - name: Load pinned app refs
        timeout-minutes: 10
      # #153: promotion consumes a successful staging release manifest instead
      # of resolving and checking out application sources again.
      - name: Load staging release manifest for promotion
        timeout-minutes: 10
        id: promotion
        if: ${{ env.PROMOTE_STAGING_RUN_ID != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$PROMOTE_STAGING_RUN_ID"
          if [ "$DEPLOY_ENV" != "production" ]; then
            echo "::error::promote_staging_run_id promotes staging to production; select environment 'production' (got '${DEPLOY_ENV}')"
            exit 1
          fi
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::promote_staging_run_id '${RUN_ID}' is not a workflow run ID"
            exit 1
          fi

          RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          RUN_PATH=$(jq -r '.path' <<< "$RUN")
          RUN_CONCLUSION=$(jq -r '.conclusion' <<< "$RUN")
          if [ "${RUN_PATH%%@*}" != ".github/workflows/deploy-k8s.yml" ]; then
            echo "::error::Run ${RUN_ID} is '${RUN_PATH}', not a Deploy to Kubernetes run"
            exit 1
          fi
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "::error::Staging run ${RUN_ID} concluded '${RUN_CONCLUSION}'; only a successful staging deploy can be promoted"
            exit 1
          fi

          # Latest attempt's staging manifest from that run.
          ARTIFACT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            | jq -r --arg prefix "release-manifest-staging-${RUN_ID}-" \
                '[.artifacts[] | select(.expired | not) | select(.name | startswith($prefix))]
                 | sort_by(.name | ltrimstr($prefix) | tonumber) | last | .name // empty')
          if [ -z "$ARTIFACT" ]; then
            echo "::error::Run ${RUN_ID} has no unexpired release-manifest-staging-${RUN_ID}-<attempt> artifact; it was not a staging deploy or the artifact expired"
            exit 1
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir _promotion
          MANIFEST=_promotion/release-manifest.json

          if ! jq -e '.environment == "staging"' "$MANIFEST" > /dev/null; then
            echo "::error::${ARTIFACT} is for environment '$(jq -r '.environment' "$MANIFEST")', not staging"
            exit 1
          fi
          jq -e '[.sources.backend.sha, .sources.frontend.sha] | all(type == "string" and test("^([0-9a-f]{40}|[0-9a-f]{64})$"))' "$MANIFEST" > /dev/null \
            || { echo "::error::${ARTIFACT} does not record full backend/frontend commit SHAs"; exit 1; }
          for key in backend backend_migrate frontend; do
            ref=$(jq -r --arg k "$key" '.images[$k] // ""' "$MANIFEST")
            if ! [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${ARTIFACT} has no digest-pinned images.${key} (got '${ref:-<none>}'); redeploy staging with this workflow and promote that run"
              exit 1
            fi
          done

          echo "Promoting staging run ${RUN_ID} (${ARTIFACT}):"
          jq '{sources, images}' "$MANIFEST"
          {
            echo "manifest=${MANIFEST}"
            echo "backend_ref=$(jq -r '.sources.backend.ref' "$MANIFEST")"
            echo "frontend_ref=$(jq -r '.sources.frontend.ref' "$MANIFEST")"
            echo "backend_sha=$(jq -r '.sources.backend.sha' "$MANIFEST")"
            echo "frontend_sha=$(jq -r '.sources.frontend.sha' "$MANIFEST")"
            echo "backend_image=$(jq -r '.images.backend' "$MANIFEST")"
            echo "backend_migrate_image=$(jq -r '.images.backend_migrate' "$MANIFEST")"
            echo "frontend_image=$(jq -r '.images.frontend' "$MANIFEST")"
          } >> "$GITHUB_OUTPUT"

      - name: Load and validate app refs
        id: refs
        env:
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          ALLOWED_REPOSITORIES: SynapsVault/backend,SynapsVault/frontend
          PROMOTED_BACKEND_REF: ${{ steps.promotion.outputs.backend_ref }}
          PROMOTED_FRONTEND_REF: ${{ steps.promotion.outputs.frontend_ref }}
        run: |
          set -euo pipefail
          if [ -n "$PROMOTE_STAGING_RUN_ID" ]; then
            # Refs come from the promoted staging manifest; nothing is re-resolved.
            {
              echo "backend=${PROMOTED_BACKEND_REF}"
              echo "frontend=${PROMOTED_FRONTEND_REF}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          . ./.github/workflows/app-versions.env
          # #155: repository_dispatch refs are untrusted input. Validate the
          # format and permitted source repositories BEFORE any checkout.
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VALIDATED=$(node scripts/validate-dispatch-refs.mjs)
            BACKEND_REF=$(printf '%s\n' "$VALIDATED" | sed -n 's/^backend_ref=//p')
            FRONTEND_REF=$(printf '%s\n' "$VALIDATED" | sed -n 's/^frontend_ref=//p')
            printf '%s\n' "$VALIDATED"
          fi
          {
            echo "backend=${BACKEND_REF}"
            echo "frontend=${FRONTEND_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout backend source
        timeout-minutes: 10
        if: ${{ env.PROMOTE_STAGING_RUN_ID == '' }}
        uses: actions/checkout@v4
        with:
          repository: SynapsVault/backend
          ref: ${{ steps.refs.outputs.backend }}
          path: _release/backend
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout frontend source
        timeout-minutes: 10
        if: ${{ env.PROMOTE_STAGING_RUN_ID == '' }}
        uses: actions/checkout@v4
        with:
          repository: SynapsVault/frontend
          ref: ${{ steps.refs.outputs.frontend }}
          path: _release/frontend
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve source revisions
        timeout-minutes: 10
        id: revisions
        env:
          PROMOTED_BACKEND_SHA: ${{ steps.promotion.outputs.backend_sha }}
          PROMOTED_FRONTEND_SHA: ${{ steps.promotion.outputs.frontend_sha }}
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ github.sha }}"
          if [ -n "$PROMOTE_STAGING_RUN_ID" ]; then
            BACKEND_SHA="$PROMOTED_BACKEND_SHA"
            FRONTEND_SHA="$PROMOTED_FRONTEND_SHA"
          else
            BACKEND_SHA=$(git -C _release/backend rev-parse HEAD)
            FRONTEND_SHA=$(git -C _release/frontend rev-parse HEAD)
          fi
          # Fail before any cluster change if a revision is not a full commit SHA.
          for pair in "deploy:${DEPLOY_SHA}" "backend:${BACKEND_SHA}" "frontend:${FRONTEND_SHA}"; do
            name="${pair%%:*}"; sha="${pair#*:}"
            if ! [[ "$sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
              echo "::error::${name} revision '${sha}' is not a full commit SHA"
              exit 1
            fi
            echo "${name}: ${sha}"
          done
          {
            echo "deploy=${DEPLOY_SHA}"
            echo "backend=${BACKEND_SHA}"
            echo "frontend=${FRONTEND_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        timeout-minutes: 10
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        timeout-minutes: 10
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Runs before any mutation: a production selection paired with staging
      # credentials (or vice versa) fails here.
      - name: Verify cluster context and namespace for the selected environment
        timeout-minutes: 10
        id: target
        run: |
          set -euo pipefail
          case "$DEPLOY_ENV" in
            production)
              EXPECTED_NAMESPACE=synapsvault-production
              KUSTOMIZE_DIR=overlays/production
              ;;
            staging)
              EXPECTED_NAMESPACE=synapsvault-staging
              KUSTOMIZE_DIR=overlays/staging
              ;;
            *)
              echo "::error::Unknown environment '${DEPLOY_ENV}'"
              exit 1
              ;;
          esac

          if [ -z "$EXPECTED_KUBE_CONTEXT" ] || [ -z "$EXPECTED_KUBE_SERVER" ]; then
            echo "::error::Set the KUBE_EXPECTED_CONTEXT and KUBE_EXPECTED_SERVER variables on the '${DEPLOY_ENV}' environment"
            exit 1
          fi

          CURRENT_CONTEXT=$(kubectl config current-context)
          CURRENT_SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          echo "Environment:     ${DEPLOY_ENV}"
          echo "Kube context:    ${CURRENT_CONTEXT} (expected ${EXPECTED_KUBE_CONTEXT})"
          echo "API server:      ${CURRENT_SERVER} (expected ${EXPECTED_KUBE_SERVER})"

          if [ "$CURRENT_CONTEXT" != "$EXPECTED_KUBE_CONTEXT" ]; then
            echo "::error::Kubeconfig context '${CURRENT_CONTEXT}' does not match the ${DEPLOY_ENV} cluster '${EXPECTED_KUBE_CONTEXT}'"
            exit 1
          fi
          if [ "${CURRENT_SERVER%/}" != "${EXPECTED_KUBE_SERVER%/}" ]; then
            echo "::error::Kubeconfig API server '${CURRENT_SERVER}' does not match the ${DEPLOY_ENV} cluster '${EXPECTED_KUBE_SERVER}'"
            exit 1
          fi

          # Every namespaced resource, and the Namespace itself, must target the
          # environment's namespace.
          RENDERED=$(kubectl kustomize "$KUSTOMIZE_DIR")
          RENDERED_NAMESPACES=$(printf '%s\n' "$RENDERED" \
            | yq -N 'select(.metadata.namespace != null) | .metadata.namespace' | sort -u)
          NAMESPACE_OBJECTS=$(printf '%s\n' "$RENDERED" \
            | yq -N 'select(.kind == "Namespace") | .metadata.name' | sort -u)
          if [ "$RENDERED_NAMESPACES" != "$EXPECTED_NAMESPACE" ] || [ "$NAMESPACE_OBJECTS" != "$EXPECTED_NAMESPACE" ]; then
            echo "::error::${KUSTOMIZE_DIR} targets namespace(s) '$(echo $RENDERED_NAMESPACES $NAMESPACE_OBJECTS)', expected only '${EXPECTED_NAMESPACE}'"
            exit 1
          fi
          echo "Namespace:       ${EXPECTED_NAMESPACE} (${KUSTOMIZE_DIR})"

          {
            echo "namespace=${EXPECTED_NAMESPACE}"
            echo "kustomize_dir=${KUSTOMIZE_DIR}"
          } >> "$GITHUB_OUTPUT"

      # #153: pin the overlay to the exact staging digests before the
      # signature/attestation gates and apply, and fail if the rendered
      # images differ from the staging manifest.
      - name: Pin promoted staging image digests
        timeout-minutes: 10
        if: ${{ env.PROMOTE_STAGING_RUN_ID != '' }}
        env:
          KUSTOMIZE_DIR: ${{ steps.target.outputs.kustomize_dir }}
          BACKEND_IMAGE: ${{ steps.promotion.outputs.backend_image }}
          BACKEND_MIGRATE_IMAGE: ${{ steps.promotion.outputs.backend_migrate_image }}
          FRONTEND_IMAGE: ${{ steps.promotion.outputs.frontend_image }}
        run: |
          set -euo pipefail
          yq -i '.patches += [
            {"target": {"kind": "Deployment", "name": "backend"},
             "patch": "- op: replace\n  path: /spec/template/spec/containers/0/image\n  value: " + strenv(BACKEND_IMAGE)},
            {"target": {"kind": "Job", "name": "backend-migrate"},
             "patch": "- op: replace\n  path: /spec/template/spec/containers/0/image\n  value: " + strenv(BACKEND_MIGRATE_IMAGE)},
            {"target": {"kind": "Deployment", "name": "frontend"},
             "patch": "- op: replace\n  path: /spec/template/spec/containers/0/image\n  value: " + strenv(FRONTEND_IMAGE)}
          ]' "${KUSTOMIZE_DIR}/kustomization.yaml"

          RENDERED=$(kubectl kustomize "$KUSTOMIZE_DIR")
          rendered_image() {
            printf '%s\n' "$RENDERED" \
              | yq -N "select(.kind == \"$1\" and .metadata.name == \"$2\") | .spec.template.spec.containers[] | select(.name == \"$3\") | .image"
          }
          status=0
          for spec in "backend:Deployment:backend:backend:${BACKEND_IMAGE}" \
                      "backend_migrate:Job:backend-migrate:migrate:${BACKEND_MIGRATE_IMAGE}" \
                      "frontend:Deployment:frontend:frontend:${FRONTEND_IMAGE}"; do
            # The image reference itself contains ':', so split off the first four fields only.
            IFS=: read -r key kind name container _ <<< "$spec"
            expected="${spec#*:*:*:*:}"
            actual=$(rendered_image "$kind" "$name" "$container")
            if [ "${actual##*@}" != "${expected##*@}" ]; then
              echo "::error::Rendered ${key} image '${actual}' does not match the staging digest '${expected}'"
              status=1
            else
              echo "${key}: ${actual}"
            fi
          done
          exit "$status"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # #156: an unsigned image, an unrecognised signing identity or an
      # unpinned tag must stop the deploy before kubectl apply.
      - name: Verify image signatures before apply
        env:
          COSIGN_IDENTITY: ${{ vars.COSIGN_IDENTITY }}
          COSIGN_OIDC_ISSUER: ${{ vars.COSIGN_OIDC_ISSUER }}
          KUSTOMIZE_DIR: ${{ steps.target.outputs.kustomize_dir }}
        run: bash scripts/verify-image-signatures.sh "$KUSTOMIZE_DIR"

      # #157: every image must carry a readable SBOM and provenance attestation
      # tied to its digest. Missing or mismatched attestations block the deploy
      # (and therefore promotion) before kubectl apply.
      - name: Verify SBOM and provenance attestations before apply
        timeout-minutes: 10
        env:
          COSIGN_IDENTITY: ${{ vars.COSIGN_IDENTITY }}
          COSIGN_OIDC_ISSUER: ${{ vars.COSIGN_OIDC_ISSUER }}
          SBOM_PREDICATE_TYPE: ${{ vars.SBOM_PREDICATE_TYPE }}
          PROVENANCE_PREDICATE_TYPE: ${{ vars.PROVENANCE_PREDICATE_TYPE }}
          KUSTOMIZE_DIR: ${{ steps.target.outputs.kustomize_dir }}
        run: bash scripts/verify-image-attestations.sh "$KUSTOMIZE_DIR"

      # #161: The base includes ServiceMonitor and PrometheusRule resources
      # (monitoring.coreos.com/v1). kubectl apply silently succeeds on the
      # YAML parse but those resources are never reconciled when the Prometheus
      # Operator CRDs are absent. Fail here with installation guidance before
      # any application resource is changed.
      - name: Check monitoring CRDs are installed
        timeout-minutes: 10
        run: |
          set -euo pipefail
          MISSING=()
          for crd in servicemonitors.monitoring.coreos.com prometheusrules.monitoring.coreos.com; do
            if ! kubectl get crd "${crd}" > /dev/null 2>&1; then
              MISSING+=("${crd}")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Required monitoring CRDs are not installed:"
            for crd in "${MISSING[@]}"; do
              echo "::error::  - ${crd}"
            done
            echo "::error::Install the Prometheus Operator first, e.g.:"
            echo "::error::  helm repo add prometheus-community https://prometheus-community.github.io/helm-charts"
            echo "::error::  helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack --namespace monitoring --create-namespace"
            echo "::error::See docs/DEPLOY-KUBERNETES.md for the full guide."
            exit 1
          fi
          echo "Monitoring CRDs present: servicemonitors.monitoring.coreos.com, prometheusrules.monitoring.coreos.com"
      - name: Stamp config checksum into backend Deployment
        timeout-minutes: 10
        # #163: Roll backend pods when backend-config changes so envFrom
        # updates take effect without an image change. Computes a SHA-256 of
        # the rendered ConfigMap data (post-substitution) and injects it as a
        # pod-template annotation via a strategic-merge patch. Any change to a
        # runtime config value produces a new hash → new pod template → rollout,
        # while keeping the selectors (matchLabels) immutable.
        env:
          KUSTOMIZE_DIR: ${{ steps.target.outputs.kustomize_dir }}
          NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: |
          set -euo pipefail
          CONFIG_HASH=$(kubectl kustomize "$KUSTOMIZE_DIR" \
            | yq -N 'select(.kind == "ConfigMap" and .metadata.name == "backend-config") | .data' \
            | sha256sum | awk '{print $1}')
          if ! [[ "$CONFIG_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not compute a valid SHA-256 for backend-config"
            exit 1
          fi
          echo "backend-config checksum: ${CONFIG_HASH}"
          cat > /tmp/backend-checksum-patch.yaml <<PATCH
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backend
            namespace: ${NAMESPACE}
          spec:
            template:
              metadata:
                annotations:
                  checksum/backend-config: "${CONFIG_HASH}"
          PATCH
          kubectl apply -k "$KUSTOMIZE_DIR" --dry-run=client \
            --patch /tmp/backend-checksum-patch.yaml > /dev/null
          echo "CONFIG_HASH=${CONFIG_HASH}" >> "$GITHUB_ENV"

      - name: Apply manifests
        timeout-minutes: 10
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
          CONFIG_HASH: ${{ env.CONFIG_HASH }}
        run: |
          set -euo pipefail
          KUSTOMIZE_DIR="${{ steps.target.outputs.kustomize_dir }}"
          # Apply the base manifests first.
          kubectl apply -k "$KUSTOMIZE_DIR"
          # Patch the config checksum annotation so a ConfigMap change alone
          # triggers a rollout even when the image tag is unchanged.
          if [ -n "${CONFIG_HASH:-}" ]; then
            kubectl patch deployment backend \
              -n "$NAMESPACE" \
              --type=merge \
              -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"checksum/backend-config\":\"${CONFIG_HASH}\"}}}}}"
          fi

      - name: Wait for rollouts
        timeout-minutes: 10
        run: |
          kubectl -n "${{ steps.target.outputs.namespace }}" rollout status deployment/backend --timeout=300s
          kubectl -n "${{ steps.target.outputs.namespace }}" rollout status deployment/frontend --timeout=300s

      - name: Write release manifest
        timeout-minutes: 10
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
          DEPLOY_SHA: ${{ steps.revisions.outputs.deploy }}
          BACKEND_SHA: ${{ steps.revisions.outputs.backend }}
          FRONTEND_SHA: ${{ steps.revisions.outputs.frontend }}
          BACKEND_REF: ${{ steps.refs.outputs.backend }}
          FRONTEND_REF: ${{ steps.refs.outputs.frontend }}
          KUSTOMIZE_DIR: ${{ steps.target.outputs.kustomize_dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # Digest of the image the live (not terminating) pods of a deployment run.
          image_digest() {
            local app="$1" container="$2" ids
            ids=$(kubectl -n "$NAMESPACE" get pods -l "app=${app}" -o json \
              | jq -r --arg c "$container" '[.items[]
                  | select(.metadata.deletionTimestamp == null)
                  | .status.containerStatuses[]?
                  | select(.name == $c)
                  | .imageID
                  | sub("^[a-z-]+://"; "")] | unique | .[]')
            if [ "$(printf '%s\n' "$ids" | grep -c 'sha256:[0-9a-f]\{64\}')" -ne 1 ]; then
              echo "::error::Expected exactly one image digest for ${app}, got: ${ids:-<none>}" >&2
              return 1
            fi
            printf '%s' "$ids"
          }

          BACKEND_IMAGE=$(image_digest backend backend)
          FRONTEND_IMAGE=$(image_digest frontend frontend)
          # The migration Job's pods are short-lived, so record the digest-pinned
          # image applied for it (the signature gate rejects unpinned images).
          BACKEND_MIGRATE_IMAGE=$(kubectl kustomize "$KUSTOMIZE_DIR" \
            | yq -N 'select(.kind == "Job" and .metadata.name == "backend-migrate") | .spec.template.spec.containers[] | select(.name == "migrate") | .image')
          if ! [[ "$BACKEND_MIGRATE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Expected a digest-pinned backend-migrate image, got: ${BACKEND_MIGRATE_IMAGE:-<none>}"
            exit 1
          fi

          jq -n \
            --arg environment "$DEPLOY_ENV" \
            --arg namespace "$NAMESPACE" \
            --arg deploy_repo "${{ github.repository }}" \
            --arg deploy_sha "$DEPLOY_SHA" \
            --arg backend_ref "$BACKEND_REF" \
            --arg backend_sha "$BACKEND_SHA" \
            --arg frontend_ref "$FRONTEND_REF" \
            --arg frontend_sha "$FRONTEND_SHA" \
            --arg backend_image "$BACKEND_IMAGE" \
            --arg frontend_image "$FRONTEND_IMAGE" \
            --arg backend_migrate_image "$BACKEND_MIGRATE_IMAGE" \
            --arg promoted_from "$PROMOTE_STAGING_RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              environment: $environment,
              namespace: $namespace,
              created_at: $created_at,
              workflow_run_url: $run_url,
              promoted_from_staging_run: (if $promoted_from == "" then null else $promoted_from end),
              sources: {
                deploy:   { repository: $deploy_repo,          sha: $deploy_sha },
                backend:  { repository: "SynapsVault/backend",  ref: $backend_ref,  sha: $backend_sha },
                frontend: { repository: "SynapsVault/frontend", ref: $frontend_ref, sha: $frontend_sha }
              },
              images: {
                backend:  $backend_image,
                backend_migrate: $backend_migrate_image,
                frontend: $frontend_image
              }
            }' > release-manifest.json

          # All three source revisions must be full commit SHAs.
          jq -e '[.sources[].sha | test("^([0-9a-f]{40}|[0-9a-f]{64})$")] | all' release-manifest.json > /dev/null \
            || { echo "::error::release-manifest.json contains a source revision that is not a full commit SHA"; exit 1; }

          cat release-manifest.json

      # #153: a promotion must run exactly the digests staging ran.
      - name: Verify production matches the promoted staging digests
        timeout-minutes: 10
        if: ${{ env.PROMOTE_STAGING_RUN_ID != '' }}
        env:
          STAGING_MANIFEST: ${{ steps.promotion.outputs.manifest }}
        run: |
          set -euo pipefail
          status=0
          for key in backend backend_migrate frontend; do
            staging=$(jq -r --arg k "$key" '.images[$k]' "$STAGING_MANIFEST")
            production=$(jq -r --arg k "$key" '.images[$k]' release-manifest.json)
            if [ "${staging##*@}" != "${production##*@}" ]; then
              echo "::error::${key} digest differs: staging ${staging}, production ${production}"
              status=1
            else
              echo "${key}: ${production##*@} (identical in staging and production)"
            fi
          done
          exit "$status"

      - name: Upload release manifest
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ env.DEPLOY_ENV }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: error

      - name: Discover DNS resolver layout
        timeout-minutes: 10
        id: dns
        run: |
          # Standard kube-dns ClusterIP (always present)
          KUBE_DNS_IP=$(kubectl -n kube-system get svc kube-dns \
            -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)
          echo "kube_dns_ip=${KUBE_DNS_IP}" >> "$GITHUB_OUTPUT"

          # NodeLocal DNS: local resolver address from the DaemonSet config
          NODELOCAL_IP=$(kubectl -n kube-system get daemonset node-local-dns \
            -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null \
            | grep -oE 'listen [0-9.]+' | awk '{print $2}' | head -n1 || true)
          if [ -z "$NODELOCAL_IP" ]; then
            # Fallback: read from kube-dns configmap (nodelocaldns convention)
            NODELOCAL_IP=$(kubectl -n kube-system get configmap kube-dns \
              -o jsonpath='{.data}' 2>/dev/null \
              | grep -oE '169\.254\.20\.10' | head -n1 || true)
          fi
          echo "nodelocal_ip=${NODELOCAL_IP}" >> "$GITHUB_OUTPUT"

          echo "kube-dns ClusterIP: ${KUBE_DNS_IP:-<none>}"
          echo "NodeLocal DNS IP:   ${NODELOCAL_IP:-<none>}"

      - name: Verify DNS (kube-dns layout)
        timeout-minutes: 10
        if: ${{ github.event.inputs.dns_layout != 'nodelocaldns' }}
        run: |
          KUBE_DNS_IP="${{ steps.dns.outputs.kube_dns_ip }}"
          if [ -z "$KUBE_DNS_IP" ]; then
            echo "kube-dns ClusterIP not found; skipping"
            exit 0
          fi
          kubectl run dns-check-kubedns --rm -i --restart=Never \
            --image=busybox:1.36 --timeout=120s \
            --overrides='{"spec":{"dnsConfig":{"nameservers":["'"$KUBE_DNS_IP"'"]}}}' \
            -- nslookup kubernetes.default.svc.cluster.local

      - name: Verify DNS (NodeLocal DNS layout)
        timeout-minutes: 10
        if: ${{ github.event.inputs.dns_layout != 'kube-dns' }}
        run: |
          NODELOCAL_IP="${{ steps.dns.outputs.nodelocal_ip }}"
          if [ -z "$NODELOCAL_IP" ]; then
            echo "NodeLocal DNS address not found; skipping"
            exit 0
          fi
          kubectl run dns-check-nodelocal --rm -i --restart=Never \
            --image=busybox:1.36 --timeout=120s \
            --overrides='{"spec":{"dnsConfig":{"nameservers":["'"$NODELOCAL_IP"'"]}}}' \
            -- nslookup kubernetes.default.svc.cluster.local

      # #160: publish a human-readable deployment summary to the Actions job
      # summary so reviewers can see environment, sources, digests and links
      # without opening logs, and without exposing credentials.
      - name: Publish deployment summary
        if: success()
        env:
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          BACKEND_SHA: ${{ steps.revisions.outputs.backend }}
          FRONTEND_SHA: ${{ steps.revisions.outputs.frontend }}
          DEPLOY_SHA: ${{ steps.revisions.outputs.deploy }}
          BACKEND_REF: ${{ steps.refs.outputs.backend }}
          FRONTEND_REF: ${{ steps.refs.outputs.frontend }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          TARGET_URL: https://${{ steps.target.outputs.namespace }}.example.com
        run: |
          set -euo pipefail
          BACKEND_IMAGE=$(jq -r '.images.backend' release-manifest.json 2>/dev/null
          BACKEND_IMAGE=${BACKEND_IMAGE:-unknown}
          FRONTEND_IMAGE=$(jq -r '.images.frontend' release-manifest.json 2>/dev/null
          FRONTEND_IMAGE=${FRONTEND_IMAGE:-unknown}
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Deployment summary
          SUMMARY
          printf '| Field | Value |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| **Environment** | %s |\n' "${DEPLOY_ENV}" >> "$GITHUB_STEP_SUMMARY"
          printf '| **Workflow run** | [link](%s) |\n' "${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
          printf '\n### Source revisions\n\n| Repo | Ref | SHA |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| SynapsVault/deploy | main | \%s\ |\n' "${DEPLOY_SHA}" >> "$GITHUB_STEP_SUMMARY"
          printf '| SynapsVault/backend | \%s\ | \%s\ |\n' "${BACKEND_REF}" "${BACKEND_SHA}" >> "$GITHUB_STEP_SUMMARY"
          printf '| SynapsVault/frontend | \%s\ | \%s\ |\n' "${FRONTEND_REF}" "${FRONTEND_SHA}" >> "$GITHUB_STEP_SUMMARY"
          printf '\n### Image digests\n\n| Image | Digest |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| backend | \%s\ |\n' "${BACKEND_IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          printf '| frontend | \%s\ |\n' "${FRONTEND_IMAGE}" >> "$GITHUB_STEP_SUMMARY"

      # #159: always collect diagnostics on failure, sanitized before upload.
      - name: Collect failure diagnostics
        if: failure()
        timeout-minutes: 10
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace || 'synapsvault-production' }}
        run: bash scripts/collect-diagnostics.sh "$NAMESPACE"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics-${{ env.DEPLOY_ENV }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-diagnostics/
          if-no-files-found: warn
