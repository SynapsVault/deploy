name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: '1.7.7'
  KUBECONFORM_VERSION: '0.6.7'
  KUBE_LINTER_VERSION: '0.7.1'
  PROMETHEUS_VERSION: '2.53.2'
  ALERTMANAGER_VERSION: '0.27.0'
  LYCHEE_VERSION: '0.24.2'
  GITLEAKS_VERSION: '8.18.4'
  TRIVY_VERSION: '0.76.2'
  HADOLINT_VERSION: '2.12.0'

jobs:
  workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
      - name: Run actionlint
        # actionlint also runs shellcheck on every `run:` block.
        run: actionlint -color

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose

  links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lychee
        run: |
          archive="$(mktemp)"
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" -o "$archive"
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $archive" | sha256sum -c -
          tar -xz -f "$archive" --strip-components=1 -C /usr/local/bin lychee-x86_64-unknown-linux-gnu/lychee
          rm -f "$archive"
      - name: Run lychee
        run: lychee --config .lychee.toml --no-progress --verbose README.md 'docs/**/*.md'

  shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh
      - name: Check bash syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: End-to-end backup.sh and restore.sh round-trip check
        run: |
          out_dir="$(mktemp -d)"
          work_dir="$(mktemp -d)"
          BACKUP_SKIP_DB=1 \
          BACKUP_SKIP_CONTRACTS=1 \
          BACKUP_SKIP_UPLOAD=1 \
          BACKUP_CLEANUP_WORK_DIR=0 \
          BACKUP_WORK_DIR="${work_dir}" \
          BACKUP_ENCRYPTION_METHOD=gpg \
          BACKUP_ENCRYPTION_KEY="ci-e2e-passphrase" \
          BACKUP_OUTPUT_DIR="${out_dir}" \
          bash scripts/backup.sh
          test -f "${out_dir}/manifest.json"
          python3 -m json.tool "${out_dir}/manifest.json" > /dev/null
          bash scripts/restore.sh --help > /dev/null
          rm -rf "${out_dir}" "${work_dir}"

  node:
    name: Node scripts and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax-check scripts
        run: for f in scripts/*.js scripts/*.cjs; do node --check "$f"; done
      - name: Check env placeholders (compose target)
        run: |
          cp .env.example .env
          node scripts/check-env.js --target compose --env-file .env || true
          # In CI the .env.example intentionally contains placeholders.
          # This step validates that check-env.js itself runs without crashing;
          # the actual placeholder check is enforced in deploy workflows where
          # real secrets are available via GitHub Actions secrets.
          node scripts/check-env.js --help > /dev/null
      - name: Check env JSON output mode
        run: |
          cp .env.example .env
          # Placeholder values may fail validation, so tolerate a non-zero exit
          # but require the output to be valid JSON with the expected shape.
          set +e
          node scripts/check-env.js --target compose --env-file .env --json > env-report.json
          status=$?
          set -e
          echo "check-env.js --json exit status: ${status}"
          python3 - <<'EOF'
          import json
          import sys

          with open('env-report.json', encoding='utf-8') as handle:
              report = json.load(handle)

          if not isinstance(report, dict):
              sys.exit('JSON report must be an object')
          if 'target' not in report:
              sys.exit('JSON report missing "target"')
          if 'errors' not in report or not isinstance(report['errors'], list):
              sys.exit('JSON report missing "errors" list')
          for entry in report['errors']:
              if not isinstance(entry, dict):
                  sys.exit('Each error entry must be an object')
              if 'code' not in entry:
                  sys.exit('Error entry missing "code"')
              if 'variables' not in entry:
                  sys.exit('Error entry missing "variables"')
          print('JSON report shape OK')
          EOF
      - name: Check env strict mode (known-good fixture)
        run: |
          # A minimal, fully populated mainnet configuration that must pass
          # --strict. Keep this fixture in sync with the strict rules in
          # scripts/check-env.js and docs/deployment.md.
          read -r public_key secret_key < <(node --input-type=module -e 'import {Keypair} from "@stellar/stellar-sdk"; const k=Keypair.random(); console.log(k.publicKey(), k.secret())')
          cat > strict.env <<EOF
          STELLAR_NETWORK=mainnet
          POSTGRES_USER=fixture_user
          POSTGRES_PASSWORD=fixture-password
          POSTGRES_DB=fixture_db
          SOROBAN_RPC_URL=https://rpc.mainnet.example.com
          SUPABASE_URL=https://fixture.supabase.co
          SUPABASE_ANON_KEY=fixture-anon-key
          SUPABASE_SERVICE_KEY=fixture-service-key
          ADMIN_API_KEY=fixture-admin-key
          OPENROUTER_API_KEY=fixture-openrouter-key
          STELLAR_PUBLIC_KEY=${public_key}
          STELLAR_SECRET_KEY=${secret_key}
          AGENT_SECRET_KEY=${secret_key}
          REGISTRY_SECRET_KEY=${secret_key}
          EOF
          node scripts/check-env.js --target compose --env-file strict.env --strict
          # Strict mode must reject testnet configuration.
          sed 's/^STELLAR_NETWORK=mainnet$/STELLAR_NETWORK=testnet/' strict.env > strict-testnet.env
          if node scripts/check-env.js --target compose --env-file strict-testnet.env --strict; then
            echo "::error::--strict accepted a testnet configuration"
            exit 1
          fi
          # Strict mode must reject insecure remote endpoints.
          sed 's#^SOROBAN_RPC_URL=.*#SOROBAN_RPC_URL=http://rpc.mainnet.example.com#' strict.env > strict-insecure.env
          if node scripts/check-env.js --target compose --env-file strict-insecure.env --strict; then
            echo "::error::--strict accepted an insecure remote endpoint"
            exit 1
          fi
      - name: Check env duplicate key detection
        run: |
          # Duplicate assignments must be reported with line numbers.
          printf 'NETWORK=mainnet\nNETWORK=testnet\n' > duplicate.env
          set +e
          output="$(node scripts/check-env.js --target compose --env-file duplicate.env 2>&1)"
          status=$?
          set -e
          echo "${output}"
          if [ "${status}" -eq 0 ]; then
            echo "::error::Duplicate keys were not reported"
            exit 1
          fi
          if ! echo "${output}" | grep -q 'NETWORK'; then
            echo "::error::Duplicate report did not mention the affected variable"
            exit 1
          fi
          if ! echo "${output}" | grep -Eq 'line[^0-9]*[0-9]+'; then
            echo "::error::Duplicate report did not include line numbers"
            exit 1
          fi
      - name: Verify check-env validation rules
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf "${work_dir}"' EXIT

          # Generate a valid Stellar keypair for the positive cases.
          read -r public_key secret_key < <(node --input-type=module -e 'import {Keypair} from "@stellar/stellar-sdk"; const k=Keypair.random(); console.log(k.publicKey(), k.secret())')
          if [ -z "${public_key}" ] || [ -z "${secret_key}" ]; then
            echo "::error::Could not parse generated keypair"
            exit 1
          fi

          # A valid contract ID (StrKey C...) for checksum validation.
          contract_id="CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD2KM"

          base_env() {
            cat <<EOF
          STELLAR_NETWORK=testnet
          POSTGRES_USER=fixture_user
          POSTGRES_PASSWORD=fixture-password
          POSTGRES_DB=fixture_db
          SOROBAN_RPC_URL=https://rpc.mainnet.example.com
          SUPABASE_URL=https://fixture.supabase.co
          SUPABASE_ANON_KEY=fixture-anon-key
          SUPABASE_SERVICE_KEY=fixture-service-key
          ADMIN_API_KEY=fixture-admin-key
          OPENROUTER_API_KEY=fixture-openrouter-key
          STELLAR_PUBLIC_KEY=${public_key}
          STELLAR_SECRET_KEY=${secret_key}
          AGENT_SECRET_KEY=${secret_key}
          REGISTRY_SECRET_KEY=${secret_key}
          STELLAR_CONTRACT_ID=${contract_id}
          EOF
          }

          expect_pass() {
            local name="$1" file="$2"
            if ! node scripts/check-env.js --target compose --env-file "${file}" > "${work_dir}/out.log" 2>&1; then
              echo "::error::check-env rejected valid case: ${name}"
              cat "${work_dir}/out.log"
              exit 1
            fi
          }

          expect_fail() {
            local name="$1" file="$2" pattern="$3"
            if node scripts/check-env.js --target compose --env-file "${file}" > "${work_dir}/out.log" 2>&1; then
              echo "::error::check-env accepted invalid case: ${name}"
              cat "${work_dir}/out.log"
              exit 1
            fi
            if ! grep -Eq "${pattern}" "${work_dir}/out.log"; then
              echo "::error::check-env error for ${name} did not match ${pattern}"
              cat "${work_dir}/out.log"
              exit 1
            fi
            # Secrets must never be echoed in diagnostics.
            if grep -qF "${secret_key}" "${work_dir}/out.log"; then
              echo "::error::check-env leaked the secret key for ${name}"
              exit 1
            fi
          }

          # Positive: documented networks are accepted.
          for network in testnet mainnet futurenet; do
            base_env | sed "s/^STELLAR_NETWORK=.*/STELLAR_NETWORK=${network}/" > "${work_dir}/valid-${network}.env"
            expect_pass "network ${network}" "${work_dir}/valid-${network}.env"
          done

          # Negative: unsupported network values are rejected.
          base_env | sed 's/^STELLAR_NETWORK=.*/STELLAR_NETWORK=devnet/' > "${work_dir}/bad-network.env"
          expect_fail "unsupported network" "${work_dir}/bad-network.env" 'STELLAR_NETWORK'

          # Negative: checksum-invalid account, secret and contract IDs.
          base_env | sed "s/^STELLAR_PUBLIC_KEY=.*/STELLAR_PUBLIC_KEY=GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF/" > "${work_dir}/bad-public.env"
          expect_fail "bad public key checksum" "${work_dir}/bad-public.env" 'STELLAR_PUBLIC_KEY'
          base_env | sed "s/^STELLAR_SECRET_KEY=.*/STELLAR_SECRET_KEY=SAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF/" > "${work_dir}/bad-secret.env"
          expect_fail "bad secret key checksum" "${work_dir}/bad-secret.env" 'STELLAR_SECRET_KEY'
          base_env | sed "s/^STELLAR_CONTRACT_ID=.*/STELLAR_CONTRACT_ID=CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF/" > "${work_dir}/bad-contract.env"
          expect_fail "bad contract checksum" "${work_dir}/bad-contract.env" 'STELLAR_CONTRACT_ID'

          # Negative: public key does not match the secret key.
          other_public="$(node --input-type=module -e 'import {Keypair} from "@stellar/stellar-sdk"; console.log(Keypair.random().publicKey())')"
          base_env | sed "s/^STELLAR_PUBLIC_KEY=.*/STELLAR_PUBLIC_KEY=${other_public}/" > "${work_dir}/mismatch.env"
          expect_fail "keypair mismatch" "${work_dir}/mismatch.env" 'STELLAR_(PUBLIC|SECRET)_KEY'

          # Negative: whitespace-only required values are treated as missing.
          base_env | sed 's/^STELLAR_NETWORK=.*/STELLAR_NETWORK="   "/' > "${work_dir}/blank-network.env"
          expect_fail "whitespace-only network" "${work_dir}/blank-network.env" 'STELLAR_NETWORK'
          base_env | sed 's/^STELLAR_PUBLIC_KEY=.*/STELLAR_PUBLIC_KEY="  "/' > "${work_dir}/blank-public.env"
          expect_fail "whitespace-only public key" "${work_dir}/blank-public.env" 'STELLAR_PUBLIC_KEY'
      - name: Lint Node scripts
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Shell unit tests
        run: sudo apt-get install -y bats && bats test/*.bats
      - name: CLI smoke tests
        run: |
          node scripts/deploy-contracts.cjs --help
          node scripts/rollback-contracts.cjs --help
          node scripts/01-generate-keypairs.js > /dev/null

  kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Install kube-linter
        run: |
          curl -sSfL "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz" \
            | tar -xz -C /usr/local/bin kube-linter
      - name: Render kustomization
        run: kubectl kustomize k8s/ > rendered.yaml
      - name: Validate rendered manifests
        run: kubeconform -strict -summary -ignore-missing-schemas rendered.yaml
      - name: Lint rendered manifests (policy checks)
        run: kube-linter lint rendered.yaml
      - name: Validate secret template
        run: kubeconform -strict -summary k8s/secrets.yaml

  monitoring:
    name: Validate monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool and amtool
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          curl -sSfL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
      - name: Check alert rules
        run: promtool check rules monitoring/alert-rules.yml
      - name: Test alert rules
        run: promtool test rules monitoring/tests/*.yml
      - name: Check Prometheus config
        # prometheus.yml references the rules at their in-container path.
        run: |
          mkdir -p /tmp/prom
          cp monitoring/alert-rules.yml /tmp/prom/
          sed 's#/etc/prometheus/alert-rules.yml#alert-rules.yml#' monitoring/prometheus.yml > /tmp/prom/prometheus.yml
          promtool check config /tmp/prom/prometheus.yml
      - name: Render Alertmanager config with CI placeholders
        run: |
          # shellcheck disable=SC2016
          sed \
            -e 's#\${ALERTMANAGER_SMTP_SMARTHOST}#smtp.example.com:587#g' \
            -e 's#\${ALERTMANAGER_SMTP_FROM}#alerts@example.com#g' \
            -e 's#\${ALERTMANAGER_SMTP_AUTH_USERNAME}#ci-user#g' \
            -e 's#\${ALERTMANAGER_SMTP_AUTH_PASSWORD}#ci-password#g' \
            -e 's#\${ALERTMANAGER_SLACK_WEBHOOK_URL}#https://hooks.slack.com/services/ci/test/webhook#g' \
            -e 's#\${ALERTMANAGER_SLACK_CHANNEL}#ci-alerts#g' \
            -e 's#\${ALERTMANAGER_PAGERDUTY_SERVICE_KEY}#ci-pagerduty-key#g' \
            -e 's#\${ALERTMANAGER_EMAIL_TO}#alerts@example.com#g' \
            monitoring/alertmanager.yml > /tmp/alertmanager.yml
      - name: Check Alertmanager config
        run: amtool check-config /tmp/alertmanager.yml
      - name: Test Alertmanager routing, grouping and inhibition
        # Exercises representative warning and critical alerts against the
        # rendered config: asserts destination selection per severity and that
        # critical alerts are never unintentionally inhibited.
        run: python3 monitoring/tests/alertmanager_routes_test.py /tmp/alertmanager.yml
      - name: Check Grafana dashboard JSON
        run: python3 -m json.tool monitoring/grafana-dashboard.json > /dev/null
      - name: Validate Grafana PromQL against metric fixtures
        # Extracts every dashboard expression and checks the referenced metric
        # names/labels against the shared fixture set used by the alert tests.
        # Renamed or absent series fail the job; expected empty-state behavior
        # is documented in docs/monitoring.md.
        run: python3 monitoring/tests/grafana_promql_test.py monitoring/grafana-dashboard.json monitoring/tests/metric-fixtures.yml
      - name: Verify monitoring retention flags and disk budgets
        # Asserts the Compose monitoring services apply explicit retention
        # flags and that the documented volume budgets match the compose file.
        run: python3 monitoring/tests/retention_budget_test.py docker-compose.yml docs/monitoring.md

  monitoring-drill:
    name: Synthetic alert delivery drill
    runs-on: ubuntu-latest
    # Manual or scheduled only: the drill posts synthetic alerts to a live
    # Alertmanager and must never gate pull requests.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install amtool
        run: |
          curl -sSfL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
      - name: Run synthetic alert drill
        env:
          ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL }}
          DRILL_EVIDENCE_DIR: ${{ runner.temp }}/monitoring-drill
        run: bash scripts/monitoring-drill.sh
      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-drill-evidence
          path: ${{ runner.temp }}/monitoring-drill
          if-no-files-found: warn
          retention-days: 30

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with example env
        run: |
          cp .env.example .env
          docker compose config --quiet

  compose-smoke:
    name: Smoke-test docker-compose startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: SynapsVault/backend
          path: src/backend
      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          repository: SynapsVault/frontend
          path: src/frontend
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare env
        run: cp .env.example .env
      - name: Check env (compose)
        # .env.example contains placeholder values; this is a best-effort check
        # to ensure check-env.js runs. Failures are informational only in CI
        # because secrets are not available in this job.
        run: node scripts/check-env.js --target compose --env-file .env || true
      - name: Start stack
        env:
          BACKEND_SRC: ./src/backend
          FRONTEND_SRC: ./src/frontend
          DEPLOY_DOCKERFILES_DIR: ../..
        run: docker compose up -d --wait
      - name: Run smoke test
        # --report writes a machine-readable JSON report (check names, duration,
        # result and sanitized errors). The script still exits nonzero on any
        # failed check, and the report never contains admin credentials.
        # --frontend-url is optional; when set, the frontend's config.js is
        # fetched and its network/API base are verified against this deployment.
        env:
          SMOKE_FRONTEND_URL: ${{ vars.SMOKE_FRONTEND_URL }}
        run: |
          args=(--report smoke-report.json)
          if [ -n "${SMOKE_FRONTEND_URL:-}" ]; then
            args+=(--frontend-url "${SMOKE_FRONTEND_URL}")
          fi
          node scripts/06-smoke-test.js "${args[@]}"
      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: smoke-report.json
          if-no-files-found: ignore
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
  hadolint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hadolint
        run: |
          curl -sSfL "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
      - name: Run hadolint
        run: |
          hadolint --version
          hadolint backend/Dockerfile frontend/Dockerfile

  docker:
    name: Build images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            repo: SynapsVault/backend
            target: runtime
          - name: backend-migrate
            repo: SynapsVault/backend
            target: migrate
          - name: frontend
            repo: SynapsVault/frontend
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned app refs
        id: refs
        run: |
          . ./.github/workflows/app-versions.env
          {
            echo "backend=${BACKEND_REF}"
            echo "frontend=${FRONTEND_REF}"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.name == 'frontend' && steps.refs.outputs.frontend || steps.refs.outputs.backend }}
          path: src
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./${{ matrix.name == 'frontend' && 'frontend' || 'backend' }}/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: synapsvault/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            OCI_IMAGE_SOURCE=${{ matrix.name == 'frontend' && 'https://github.com/SynapsVault/frontend' || 'https://github.com/SynapsVault/backend' }}
            OCI_IMAGE_REVISION=${{ matrix.name == 'frontend' && steps.refs.outputs.frontend || steps.refs.outputs.backend }}
            OCI_IMAGE_CREATED=${{ github.event.pull_request.head.sha != '' && github.event.pull_request.head.sha || github.sha }}
            OCI_IMAGE_VERSION=${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
      - name: Measure and report image size (frontend)
        if: matrix.name == 'frontend'
        run: |
          # Get compressed size (what gets pushed to registry)
          compressed_size=$(docker image inspect synapsvault/frontend:ci --format '{{.Size}}')
          compressed_mb=$((compressed_size / 1024 / 1024))
          echo "Frontend image compressed size: ${compressed_mb} MB (${compressed_size} bytes)"
          echo "frontend-image-size-mb=${compressed_mb}" >> "$GITHUB_OUTPUT"
          echo "frontend-image-size-bytes=${compressed_size}" >> "$GITHUB_OUTPUT"
          # Budget check: warn if over 100MB
          if [ ${compressed_mb} -gt 100 ]; then
            echo "::warning::Frontend image size (${compressed_mb} MB) exceeds budget of 100 MB"
          fi
      - name: Install Trivy
        run: |
          archive="$(mktemp)"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o "$archive"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $archive" | sha256sum -c -
          tar -xz -f "$archive" -C /usr/local/bin trivy
          rm -f "$archive"
      - name: Scan ${{ matrix.name }} for vulnerabilities
        # Fail the build on any CRITICAL CVE and emit SARIF for code scanning.
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format sarif \
            --output trivy-${{ matrix.name }}.sarif \
            synapsvault/${{ matrix.name }}:ci
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  frontend-runtime:
    name: Verify frontend runtime behavior
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned app refs
        id: refs
        run: |
          . ./.github/workflows/app-versions.env
          echo "frontend=${FRONTEND_REF}" >> "$GITHUB_OUTPUT"
      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          repository: SynapsVault/frontend
          ref: ${{ steps.refs.outputs.frontend }}
          path: src
      - uses: docker/setup-buildx-action@v4
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./frontend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: synapsvault/frontend:ci
          cache-from: type=gha,scope=frontend
      - name: Verify routing and health endpoint
        run: |
          set -euo pipefail
          container_id="$(docker run -d -p 127.0.0.1:8080:8080 \
            -e APP_API_URL=/api \
            -e APP_NETWORK=mainnet \
            synapsvault/frontend:ci)"
          cleanup() { docker rm -f "${container_id}" > /dev/null 2>&1 || true; }
          trap cleanup EXIT
          # Wait for the server to accept connections.
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          health_body="$(curl -fsS http://127.0.0.1:8080/healthz)"
          echo "health body: ${health_body}"
          test -n "${health_body}"
          missing_asset_code="$(curl -o /dev/null -s -w '%{http_code}' http://127.0.0.1:8080/assets/does-not-exist.js)"
          echo "missing asset status: ${missing_asset_code}"
          test "${missing_asset_code}" = "404"
          missing_css_code="$(curl -o /dev/null -s -w '%{http_code}' http://127.0.0.1:8080/assets/does-not-exist.css)"
          echo "missing css status: ${missing_css_code}"
          test "${missing_css_code}" = "404"
          route_body="$(curl -fsS http://127.0.0.1:8080/dashboard)"
          echo "${route_body}" | grep -qi '<div id="root"'
          # A missing asset must not masquerade as a health response.
          if curl -fsS http://127.0.0.1:8080/assets/does-not-exist.js | grep -qi 'ok'; then
            echo "::error::Missing asset returned a health-like response"
            exit 1
          fi
      - name: Verify invalid runtime config fails fast
        run: |
          set -euo pipefail
          run_invalid() {
            local field="$1" value="$2"
            local output status
            set +e
            output="$(docker run --rm \
              -e APP_API_URL=/api \
              -e APP_NETWORK=mainnet \
              -e "${field}=${value}" \
              synapsvault/frontend:ci 2>&1)"
            status=$?
            set -e
            echo "${output}"
            if [ "${status}" -eq 0 ]; then
              echo "::error::Container started with invalid ${field}"
              exit 1
            fi
            if ! echo "${output}" | grep -q "${field}"; then
              echo "::error::Error message did not mention ${field}"
              exit 1
            fi
          }
          run_invalid APP_API_URL 'not a url'
          run_invalid APP_NETWORK ''
      - name: Verify runtime config escaping with hostile input
        run: |
          set -euo pipefail
          cat > /tmp/config-fixture.mjs <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const fixtures = [
            { name: 'quotes', value: `he said "hi" and 'bye'` },
            { name: 'line-breaks', value: 'line1\nline2\r\nline3' },
            { name: 'backslashes', value: 'C:\\path\\to\\file \\n \\\\' },
            { name: 'script-like', value: '</script><script>globalThis.pwned=true</script>' },
          ];

          for (const fixture of fixtures) {
            const output = execFileSync(
              'docker',
              [
                'run', '--rm',
                '-e', 'APP_API_URL=/api',
                '-e', 'APP_NETWORK=mainnet',
                '-e', `APP_EXTRA=${fixture.value}`,
                'synapsvault/frontend:ci',
                'cat', '/usr/share/nginx/html/config.js',
              ],
              { encoding: 'utf8' },
            );
            // Parse as a module without executing injected code.
            const parsed = new Function(`${output}\nreturn CONFIG;`)();
            if (parsed.APP_EXTRA !== fixture.value) {
              throw new Error(`round-trip mismatch for ${fixture.name}`);
            }
            if (globalThis.pwned) {
              throw new Error(`injected code executed for ${fixture.name}`);
            }
          }
          console.log('hostile input fixtures passed');
          EOF
          node /tmp/config-fixture.mjs

  docker-main:
    name: Build images against app main (optional)
    runs-on: ubuntu-latest
    # Optional job: exercises the app repos' moving `main` without gating PRs.
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            repo: SynapsVault/backend
            target: runtime
          - name: backend-migrate
            repo: SynapsVault/backend
            target: migrate
          - name: frontend
            repo: SynapsVault/frontend
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - name: Checkout application source (main)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: main
          path: src
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./${{ matrix.name == 'frontend' && 'frontend' || 'backend' }}/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}-main
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-main
          build-args: |
            OCI_IMAGE_SOURCE=${{ matrix.name == 'frontend' && 'https://github.com/SynapsVault/frontend' || 'https://github.com/SynapsVault/backend' }}
            OCI_IMAGE_REVISION=${{ github.sha }}
            OCI_IMAGE_CREATED=${{ github.sha }}
            OCI_IMAGE_VERSION=main
