name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: '1.7.7'
  KUBECONFORM_VERSION: '0.6.7'
  KUBE_LINTER_VERSION: '0.7.1'
  PROMETHEUS_VERSION: '2.53.2'
  ALERTMANAGER_VERSION: '0.27.0'
  LYCHEE_VERSION: '0.15.1'
  GITLEAKS_VERSION: '8.18.4'
  TRIVY_VERSION: '0.55.2'
  HADOLINT_VERSION: '2.12.0'

jobs:
  workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
      - name: Run actionlint
        # actionlint also runs shellcheck on every `run:` block.
        run: actionlint -color

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose

  links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install lychee
        run: |
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin lychee
      - name: Run lychee
        run: lychee --no-progress --verbose README.md 'docs/**/*.md'

  shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh
      - name: Check bash syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: End-to-end backup.sh and restore.sh round-trip check
        run: |
          out_dir="$(mktemp -d)"
          work_dir="$(mktemp -d)"
          BACKUP_SKIP_DB=1 \
          BACKUP_SKIP_CONTRACTS=1 \
          BACKUP_SKIP_UPLOAD=1 \
          BACKUP_CLEANUP_WORK_DIR=0 \
          BACKUP_WORK_DIR="${work_dir}" \
          BACKUP_ENCRYPTION_METHOD=gpg \
          BACKUP_ENCRYPTION_KEY="ci-e2e-passphrase" \
          BACKUP_OUTPUT_DIR="${out_dir}" \
          bash scripts/backup.sh
          test -f "${out_dir}/manifest.json"
          python3 -m json.tool "${out_dir}/manifest.json" > /dev/null
          bash scripts/restore.sh --help > /dev/null
          rm -rf "${out_dir}" "${work_dir}"

  node:
    name: Node scripts and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax-check scripts
        run: for f in scripts/*.js scripts/*.cjs; do node --check "$f"; done
      - name: Check env placeholders (compose target)
        run: |
          cp .env.example .env
          node scripts/check-env.js --target compose --env-file .env || true
          # In CI the .env.example intentionally contains placeholders.
          # This step validates that check-env.js itself runs without crashing;
          # the actual placeholder check is enforced in deploy workflows where
          # real secrets are available via GitHub Actions secrets.
          node scripts/check-env.js --help > /dev/null
      - name: Unit tests
        run: npm test
      - name: CLI smoke tests
        run: |
          node scripts/deploy-contracts.cjs --help
          node scripts/rollback-contracts.cjs --help
          node scripts/01-generate-keypairs.js > /dev/null

  kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Install kube-linter
        run: |
          curl -sSfL "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz" \
            | tar -xz -C /usr/local/bin kube-linter
      - name: Render kustomization
        run: kubectl kustomize k8s/ > rendered.yaml
      - name: Validate rendered manifests
        run: kubeconform -strict -summary rendered.yaml
      - name: Lint rendered manifests (policy checks)
        run: kube-linter lint rendered.yaml
      - name: Validate secret template
        run: kubeconform -strict -summary k8s/secrets.yaml

  monitoring:
    name: Validate monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install promtool and amtool
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          curl -sSfL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
      - name: Check alert rules
        run: promtool check rules monitoring/alert-rules.yml
      - name: Test alert rules
        run: promtool test rules monitoring/tests/*.yml
      - name: Check Prometheus config
        # prometheus.yml references the rules at their in-container path.
        run: |
          mkdir -p /tmp/prom
          cp monitoring/alert-rules.yml /tmp/prom/
          sed 's#/etc/prometheus/alert-rules.yml#alert-rules.yml#' monitoring/prometheus.yml > /tmp/prom/prometheus.yml
          promtool check config /tmp/prom/prometheus.yml
      - name: Check Alertmanager config
        run: amtool check-config monitoring/alertmanager.yml
      - name: Check Grafana dashboard JSON
        run: python3 -m json.tool monitoring/grafana-dashboard.json > /dev/null

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate with example env
        run: |
          cp .env.example .env
          docker compose config --quiet

  compose-smoke:
    name: Smoke-test docker-compose startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout application source
        uses: actions/checkout@v7
        with:
          repository: SynapsVault/backend
          path: src/backend
      - name: Checkout frontend source
        uses: actions/checkout@v7
        with:
          repository: SynapsVault/frontend
          path: src/frontend
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare env
        run: cp .env.example .env
      - name: Check env (compose)
        # .env.example contains placeholder values; this is a best-effort check
        # to ensure check-env.js runs. Failures are informational only in CI
        # because secrets are not available in this job.
        run: node scripts/check-env.js --target compose --env-file .env || true
      - name: Start stack
        run: docker compose up -d --wait
      - name: Run smoke test
        run: node scripts/06-smoke-test.js
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
  hadolint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install hadolint
        run: |
          curl -sSfL "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
      - name: Run hadolint
        run: |
          hadolint --version
          hadolint backend/Dockerfile frontend/Dockerfile

  docker:
    name: Build images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            repo: SynapsVault/backend
            target: runtime
          - name: backend-migrate
            repo: SynapsVault/backend
            target: migrate
          - name: frontend
            repo: SynapsVault/frontend
            target: runtime
    steps:
      - uses: actions/checkout@v7
      - name: Load pinned app refs
        id: refs
        run: |
          set -a
          . ./.github/workflows/app-versions.env
          set +a
          echo "backend=${BACKEND_REF}" >> "$GITHUB_OUTPUT"
          echo "frontend=${FRONTEND_REF}" >> "$GITHUB_OUTPUT"
      - name: Checkout application source
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.name == 'frontend' && steps.refs.outputs.frontend || steps.refs.outputs.backend }}
          path: src
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./${{ matrix.name == 'frontend' && 'frontend' || 'backend' }}/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: synapsvault/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Install Trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
      - name: Scan ${{ matrix.name }} for vulnerabilities
        # Fail the build on any CRITICAL CVE and emit SARIF for code scanning.
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format sarif \
            --output trivy-${{ matrix.name }}.sarif \
            synapsvault/${{ matrix.name }}:ci
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  docker-main:
    name: Build images against app main (optional)
    runs-on: ubuntu-latest
    # Optional job: exercises the app repos' moving `main` without gating PRs.
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            repo: SynapsVault/backend
            target: runtime
          - name: backend-migrate
            repo: SynapsVault/backend
            target: migrate
          - name: frontend
            repo: SynapsVault/frontend
            target: runtime
    steps:
      - uses: actions/checkout@v7
      - name: Checkout application source (main)
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: main
          path: src
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./${{ matrix.name == 'frontend' && 'frontend' || 'backend' }}/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}-main
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-main
